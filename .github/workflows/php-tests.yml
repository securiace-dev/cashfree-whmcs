name: PHP helper tests

on:
  push:
    branches: [master, 'cursor/**']
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: Show PHP version
        run: php -v
      - name: Run Cashfree helper tests
        run: php tests/CashfreeHelpersTest.php

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Build immutable artifact
        run: bash scripts/package-immutable.sh
      - name: Show manifest
        run: cat dist/cashfree-whmcs-*.manifest
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cashfree-whmcs-immutable
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.manifest
          if-no-files-found: error
